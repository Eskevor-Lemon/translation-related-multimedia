<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .player-container {
            width: 90%;
            max-width: 800px;
        }

        audio {
            width: 100%;
        }

        #message {
            color: #ccc;
            margin-top: 15px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="player-container">

    <audio
        id="player"
        controls
        preload="metadata">
    </audio>

    <div id="message"></div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");

    const player = document.getElementById("player");
    const message = document.getElementById("message");

    if (!src) {
        message.textContent = "No audio file specified.";
    } else {

        player.src = src;

        player.addEventListener("loadedmetadata", () => {
            message.textContent = "";
        });

        player.addEventListener("error", () => {
            message.textContent =
                "Audio failed to load: " + src;
        });

        player.load();
    }
</script>

</body>
</html>
