<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .player-container {
            width: 90%;
            max-width: 800px;
        }

        audio {
            width: 100%;
        }

        .error {
            color: white;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="player-container">
    <audio
        id="player"
        controls
        preload="metadata">
        Your browser does not support HTML5 audio.
    </audio>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");

    const player = document.getElementById("player");

    if (src) {
        player.src = src;
        player.load();
    } else {
        document.body.innerHTML =
            '<div class="error">No audio file specified.</div>';
    }
</script>

</body>
</html>
